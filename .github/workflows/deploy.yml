name: Deploy HEXFALL to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/, assets/, pubspec.yaml etc. Generate the web
      # runner (web/index.html and friends) on the fly; existing files are kept.
      - name: Generate web platform files
        run: |
          flutter create . --platforms=web --project-name hexfall
          rm -f test/widget_test.dart

      - run: flutter pub get

      # Tests are reported but do not block the deploy while the project is
      # still being brought up on real devices. Remove continue-on-error later.
      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
